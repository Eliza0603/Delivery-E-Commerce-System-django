<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Meu Delivery</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .register-card { background: white; padding: 30px 40px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h1 { color: #1e3799; margin-bottom: 20px; font-size: 24px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #666; font-weight: bold; }
        .input-group input { width: 100%; padding: 9px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }
        .btn-submit { width: 100%; background-color: #0984e3; color: white; border: none; padding: 11px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-submit:hover { background-color: #74b9ff; }
        .login-link { margin-top: 20px; font-size: 13px; color: #666; border-top: 1px solid #eee; padding-top: 15px; }
        .login-link a { color: #1e3799; text-decoration: none; font-weight: bold; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-card">
        <h1>📝 Criar Conta</h1>
        <form method="POST">
            {% csrf_token %}
            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="text" id="telefone" name="telefone" required>
                </div>
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" required>
                </div>
                <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>
            </div>

            <div class="input-group">
                <label for="rua">Rua / Logradouro</label>
                <input type="text" id="rua" name="rua" required>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" required>
                </div>
                <div class="input-group">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-submit">Cadastrar</button>
        </form>

        <div class="login-link">
            Já tem uma conta? <br>
            <a href="/login/">Fazer Login</a>
        </div>
    </div>
</body>
</html>
