{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Meu Delivery</title>
    
    <!-- IMPORTANTE: Adicione o link para o CSS do login aqui! -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-card">
        <h1>🍔 Entrar</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>
            <!-- O seu CSS usa a classe .btn-submit, vamos garantir que ela está aqui -->
            <button type="submit" class="btn-submit">Acessar Sistema</button>
        </form>

        <div class="links-container">
            <div>
                Ainda não tem uma conta? <br>
                <a href="/cadastro/">Criar Conta / Cadastrar</a>
            </div>
            <div>
                É gestor do restaurante? <br>
                <a href="/admin-dashboard/">Acessar Painel Admin</a>
            </div>
        </div>
    </div>
</body>
</html>
