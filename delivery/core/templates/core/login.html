<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meu Delivery</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h1 { color: #1e3799; margin-bottom: 20px; font-size: 24px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { width: 100%; background-color: #0984e3; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-submit:hover { background-color: #74b9ff; }
        .links-container { margin-top: 20px; font-size: 13px; color: #666; border-top: 1px solid #eee; padding-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .links-container a { color: #1e3799; text-decoration: none; font-weight: bold; }
        .links-container a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🍔 Entrar</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-submit">Acessar Sistema</button>
        </form>

        <div class="links-container">
    <div>
        Ainda não tem uma conta? <br>
        <a href="/cadastro/">Criar Conta / Cadastrar</a>
    </div>
    <div>
        É gestor do restaurante? <br>
        <a href="/admin-dashboard/">Acessar Painel Admin</a>
    </div>
</div>
    </div>
</body>
</html>
